apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-app-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/actions.custom-routing: >
      {"Type": "fixed-response", "FixedResponseConfig": {"ContentType": "text/plain", "StatusCode": "403", "MessageBody": "Invalid Tenant"}}
      alb.ingress.kubernetes.io/conditions.custom-routing: >
      [{"Field":"http-header","HttpHeaderConfig":{"HttpHeaderName":"X-Tenant-ID","Values":["valid-tenant"]}}]
spec:
  rules:
  - host: flask-api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
      - path: /custom-routing
        pathType: Prefix
        backend:
          service:
            name: flask-app-service
            port:
              number: 80
